<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImageKit – Image Converter & Compressor</title>
    <meta name="description" content="Fast, private browser-based image converter, compressor, and resizer. Convert between JPG, PNG, WebP, BMP, and ICO without server uploads." />
    <meta property="og:title" content="ImageKit – Image Converter & Compressor" />
    <meta property="og:description" content="Fast, private browser-based image converter, compressor, and resizer. Convert between JPG, PNG, WebP, BMP, and ICO without server uploads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
      crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Lightweight Preloader Styles -->
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090d16;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-preloader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <!-- Immediate CSS Preloader -->
    <div id="app-preloader">
      <div class="preloader-spinner"></div>
      <div style="margin-top: 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #94a3b8;">
        ImageKit
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Dismiss preloader once window finishes loading or React initializes
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const p = document.getElementById('app-preloader');
          if (p) p.classList.add('loaded');
        }, 120);
      });
    </script>
  </body>
</html>
